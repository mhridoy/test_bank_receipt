<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>OCR bench</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
</head>
<body style="padding:20px">
<h1>OCR bench</h1>
<pre id="out" class="mono" style="white-space:pre-wrap;font-size:11px"></pre>
<script type="module">
import { parseText, buildName } from "/static/engine.js";
import { readPdf, OCR_PROFILES } from "/static/reader.js";
const out = document.getElementById("out");
const log = (m) => { out.textContent += m + "\n"; };
const samples = {{ samples|tojson }};
const TPL = "{bank}_{party}_{currency}{amount}_{inv}_{dmy}";
window.BENCH = [];
const profiles = new URLSearchParams(location.search).get("profiles")?.split(",") || ["fast","balanced","sharp"];
for (const name of samples) {
  for (const profile of profiles) {
    const t0 = performance.now();
    try {
      const buffer = await (await fetch("/samples/" + encodeURIComponent(name), {cache:"force-cache"})).arrayBuffer();
      const r = await readPdf(buffer, { allowOcr: true, profile });
      const fields = parseText(r.text, {});
      const entry = { name, profile, engine: r.engine, secs: +((performance.now()-t0)/1000).toFixed(1),
                      conf: r.confidence ?? null, proposed: buildName(fields, TPL, name, true, true, 2, {shortBankNames:true}),
                      fields, text: r.text };
      window.BENCH.push(entry);
      log(`${name} [${profile}] ${entry.engine} ${entry.secs}s conf=${entry.conf}\n   -> ${entry.proposed}`);
    } catch (err) { log(`${name} [${profile}] ERROR ${err}`); }
  }
}
log("DONE");
window.TEST_DONE = true;
</script>
</body></html>
